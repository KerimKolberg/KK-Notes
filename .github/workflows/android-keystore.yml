name: Android debug keystore

# Run this ONCE, then never again unless you want to rotate the key.
#
# It mints an Android debug keystore, prints its SHA-1 (which is what Google
# needs for an Android OAuth client), and uploads the keystore base64-encoded as
# a build artifact. Save that text as the repository secret
# ANDROID_DEBUG_KEYSTORE_B64 and every later APK build signs with the same key —
# which is the whole point, because Google pins an Android OAuth client to the
# package name plus the signing certificate's SHA-1, and Gradle otherwise mints a
# fresh throwaway key on every clean runner.
#
# Why a workflow rather than "run keytool locally": keytool comes with a JDK, and
# this needs nothing installed on your own machine.
#
# The artifact holds a private key. It is a *debug* key for a personal build, not
# a Play Store upload key, but it is still a key: it is visible to anyone with
# read access to this repository, so delete the artifact once the secret is
# saved. Anyone holding it could sign an APK that Android would accept as an
# update to this app.
on:
  workflow_dispatch:

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mint the keystore
        run: |
          # The alias, passwords and subject are Android's own debug-key
          # conventions, and Gradle's debug signing config expects exactly these.
          # 30 years, so it never expires mid-project.
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print the SHA-1 to paste into Google Cloud
        run: |
          echo "=============================================================="
          echo " Paste the SHA1 value below into the Google Cloud console when"
          echo " you create the Android OAuth client (package: com.notex.app)."
          echo "=============================================================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null | grep -E 'SHA1:|SHA256:'

      - name: Encode it for the repository secret
        run: base64 -w0 debug.keystore > debug.keystore.b64

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-base64
          path: debug.keystore.b64
          # Short, because this is a private key sitting in an artifact.
          retention-days: 1

      - name: What to do next
        run: |
          echo "1. Download the 'debug-keystore-base64' artifact from this run."
          echo "2. Open debug.keystore.b64 and copy ALL of its text (one long line)."
          echo "3. Repository → Settings → Secrets and variables → Actions → New"
          echo "   repository secret, named ANDROID_DEBUG_KEYSTORE_B64, with that"
          echo "   text as the value."
          echo "4. Delete the artifact from this run's page."
          echo "5. Re-run 'Android APK'. Its log will print the same SHA-1 as above,"
          echo "   and will keep doing so for every future build."
