name: Android APK

# Manual trigger (works from the GitHub mobile app / mobile web too:
# Actions tab → Android APK → Run workflow) so an APK can be built and
# tested without a desktop at all.
on:
  workflow_dispatch:

permissions:
  contents: write # to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # arm64 only: every phone and tablet this is meant to be tested on is
      # aarch64, and a universal debug APK carrying all four ABIs of unstripped
      # Rust came to 135 MB — three cross-compiles and ~100 MB of upload spent
      # on architectures nothing here will ever run on.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src-tauri/gen/android/app/.cxx
          key: cargo-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Point NDK_HOME at the runner's preinstalled NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            # Fallback: pick the newest ndk/* directory under the SDK root.
            NDK="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          fi
          [ -d "$NDK" ] || { echo "::error::No Android NDK found on this runner"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK"

      - run: npm ci

      - name: Build debug APK
        env:
          # The Google OAuth client id for Drive sync. Not a secret — an
          # installed app is a *public* OAuth client, which is exactly why the
          # flow uses PKCE instead of a client secret — so it lives in a repo
          # variable rather than a secret, and an empty one simply builds an
          # APK whose Cloud Sync panel says it has no client id.
          NOTEX_GOOGLE_CLIENT_ID: ${{ vars.NOTEX_GOOGLE_CLIENT_ID }}
        run: ./build-android.sh --debug --abi aarch64

      - name: Locate the APK
        id: apk
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: kk-notes-debug-apk
          path: ${{ steps.apk.outputs.path }}

      # Attached to a release rather than left as a build artifact, because an
      # artifact only downloads as a zip and a phone is a bad place to unpack
      # one. Uploaded with `gh` (preinstalled on the runner) instead of an
      # action so the upload can be retried: a release asset this size fails
      # intermittently with a bare "Error saving asset", which has already cost
      # one otherwise-green build.
      - name: Publish as a release asset (plain .apk, no zip to extract)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-debug-${{ github.run_number }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          cat > notes.md <<'EOF'
          Debug build, auto-signed with Gradle's debug key — it installs
          directly, with no signing step needed. arm64 only.

          Download the `.apk` below on your phone and open it to install.
          You may need to allow "install unknown apps" for whichever app you
          use to open it (Chrome, Files, etc.) the first time.
          EOF
          echo "Built from ${{ github.sha }}." >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --title "Android debug APK (run ${{ github.run_number }})" --notes-file notes.md
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$APK" --clobber; then
              echo "Attached $(basename "$APK") ($(du -h "$APK" | cut -f1)) on attempt $attempt"
              exit 0
            fi
            echo "::warning::Upload attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not attach the APK to $TAG after 3 attempts"
          exit 1
