name: Android APK

# Manual trigger (works from the GitHub mobile app / mobile web too:
# Actions tab → Android APK → Run workflow) so an APK can be built and
# tested without a desktop at all.
#
# Two kinds of build, chosen when it is run:
#
#   release (the default)  optimised Rust, shrunk Kotlin, no debug symbols: a fraction of the size of the
#                          debug build and the one to use day to day.
#   debug                  unoptimised, with symbols, inspectable from a desktop Chrome: for chasing a
#                          bug on the device.
#
# Both are signed with the same key (the "debug" keystore kept in ANDROID_DEBUG_KEYSTORE_B64), because
# Android only installs an update over an app signed with the same key, and Google pins the Android
# OAuth client to that key's SHA-1. So either kind installs over the other and keeps the notes on the
# device, and Drive sign-in works in both.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "release: small and optimised, for everyday use. debug: for chasing a bug."
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: write # to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # arm64 only: every phone and tablet this is meant to be tested on is
      # aarch64, and a universal debug APK carrying all four ABIs of unstripped
      # Rust came to 135 MB — three cross-compiles and ~100 MB of upload spent
      # on architectures nothing here will ever run on.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src-tauri/gen/android/app/.cxx
          key: cargo-android-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-

      - name: Point NDK_HOME at the runner's preinstalled NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            # Fallback: pick the newest ndk/* directory under the SDK root.
            NDK="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          fi
          [ -d "$NDK" ] || { echo "::error::No Android NDK found on this runner"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK"

      - run: npm ci

      # Google pins an Android OAuth client to package name *plus* the signing
      # certificate's SHA-1, so the key the APK is signed with has to be the same
      # one every build. Gradle's debug signing config reads
      # `~/.android/debug.keystore` and *mints a fresh one* when it is missing —
      # which, on a clean runner, is every build. Without this step Drive sign-in
      # on Android works for exactly one APK and then fails with
      # `invalid_request`/`Custom scheme URIs are not allowed`.
      - name: Restore the debug keystore, so the signing SHA-1 is stable
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Restored the debug keystore from ANDROID_DEBUG_KEYSTORE_B64."
            echo "KEY_IS_STABLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_DEBUG_KEYSTORE_B64 secret is set, so Gradle will mint a throwaway debug key and this APK's signing SHA-1 will differ from the last one. Google Drive sign-in on Android pins that SHA-1, so it will stop working until the new one is registered. Run the 'Android debug keystore' workflow once and save its output as that secret — see docs/google-drive-setup.md."
          fi

      - name: Build the APK (${{ inputs.variant || 'release' }})
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
          # What the app says it is (Settings, at the foot): the release this build is published under.
          KK_BUILD_LABEL: ${{ (inputs.variant || 'release') == 'release' && format('android-{0}', github.run_number) || format('android-debug-{0}', github.run_number) }}
          # The Google OAuth client id for Drive sync. Not a secret — an
          # installed app is a *public* OAuth client, which is exactly why the
          # flow uses PKCE instead of a client secret — so it lives in a repo
          # variable rather than a secret, and an empty one simply builds an
          # APK whose Cloud Sync panel says it has no client id.
          # The repository variable wins if set; otherwise the project's Android client id.
          NOTEX_GOOGLE_CLIENT_ID: ${{ vars.NOTEX_GOOGLE_CLIENT_ID || '712516787688-8cg6v8ijgs2nnlv7l2p3s28bs00keubd.apps.googleusercontent.com' }}
        run: ./build-android.sh "--$VARIANT" --abi aarch64

      # A release build comes out of Gradle unsigned, and Android installs nothing unsigned. It is signed
      # here with the same key the debug build is signed with (see the top of this file for why it has to
      # be the same one), after `zipalign`, which has to come first: aligning afterwards breaks the
      # signature.
      - name: Sign the release APK
        if: ${{ (inputs.variant || 'release') == 'release' }}
        run: |
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"
          [ -n "$UNSIGNED" ] || { echo "::error::No release APK produced"; exit 1; }
          if [ ! -f ~/.android/debug.keystore ]; then
            # No saved key: mint one so the APK installs at all. It will not install over an earlier
            # build, and Drive sign-in will not accept it (the warning above says what to do).
            keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          TOOLS="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          [ -x "$TOOLS/apksigner" ] || { echo "::error::No apksigner in the Android build tools"; exit 1; }
          OUT="$(dirname "$UNSIGNED")/KK-Notes-arm64.apk"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$TOOLS/apksigner" sign --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android --out "$OUT" aligned.apk
          "$TOOLS/apksigner" verify --print-certs "$OUT" | head -3
          rm -f "$UNSIGNED" aligned.apk
          echo "Signed: $OUT ($(du -h "$OUT" | cut -f1))"

      # Printed every build, because it is the value Google needs and because a
      # *change* in it is the one thing that silently breaks Android sign-in.
      # Fingerprints identify a certificate; they are not secret.
      - name: Print the signing SHA-1 (Google pins this for Android OAuth)
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "No debug keystore was produced, so this APK is not debug-signed."
            exit 0
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null |
            grep -E 'SHA1:|SHA256:' || echo "Could not read the fingerprints."

      - name: Locate the APK
        id: apk
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: kk-notes-${{ inputs.variant || 'release' }}-apk
          path: ${{ steps.apk.outputs.path }}

      # Attached to a release rather than left as a build artifact, because an
      # artifact only downloads as a zip and a phone is a bad place to unpack
      # one. Uploaded with `gh` (preinstalled on the runner) instead of an
      # action so the upload can be retried: a release asset this size fails
      # intermittently with a bare "Error saving asset", which has already cost
      # one otherwise-green build.
      - name: Publish as a release asset (plain .apk, no zip to extract)
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant || 'release' }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          # `android-<n>` for a release build, `android-debug-<n>` for a debug one, as before.
          if [ "$VARIANT" = "release" ]; then TAG="android-${{ github.run_number }}"; else TAG="android-debug-${{ github.run_number }}"; fi
          if [ "$VARIANT" = "release" ]; then
            cat > notes.md <<'EOF'
          Release build: optimised and a fraction of the size of the debug
          build. arm64 only. Signed with the same key as the debug builds, so
          it installs over one (and the other way round) and keeps the notes
          on the device.

          Download the `.apk` below on your phone and open it to install.
          You may need to allow "install unknown apps" for whichever app you
          use to open it (Chrome, Files, etc.) the first time.
          EOF
          else
            cat > notes.md <<'EOF'
          Debug build, auto-signed with Gradle's debug key — it installs
          directly, with no signing step needed. arm64 only.

          Download the `.apk` below on your phone and open it to install.
          You may need to allow "install unknown apps" for whichever app you
          use to open it (Chrome, Files, etc.) the first time.
          EOF
          fi
          [ -n "$KEY_IS_STABLE" ] || echo "**Signed with a throwaway key** (no ANDROID_DEBUG_KEYSTORE_B64 secret is set): it will not install over an earlier build, and Drive sign-in will not accept it." >> notes.md
          echo "Built from ${{ github.sha }}." >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --prerelease --title "Android $VARIANT APK (run ${{ github.run_number }})" --notes-file notes.md
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$APK" --clobber; then
              echo "Attached $(basename "$APK") ($(du -h "$APK" | cut -f1)) on attempt $attempt"
              exit 0
            fi
            echo "::warning::Upload attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Could not attach the APK to $TAG after 3 attempts"
          exit 1
