[workspace]
members = [".", "notes-sync"]

[package]
name = "notes-taking-app"
version = "0.1.0"
description = "Multi-page inking notes for pen-first 2-in-1 devices"
authors = ["Notes contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "notes_taking_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notes-sync = { path = "notes-sync" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
