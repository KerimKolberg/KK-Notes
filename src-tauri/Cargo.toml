[workspace]
members = [".", "notes-sync", "notex-http"]

[package]
name = "notes-taking-app"
version = "0.1.0"
description = "KK-Notes: multi-page inking notes for pen-first 2-in-1 devices"
authors = ["Notes contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "notes_taking_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Opens the *system* browser for the OAuth consent screen. RFC 8252 forbids
# doing it in an embedded webview and Google enforces that, so this is not an
# implementation detail that could be swapped for `window.open`.
tauri-plugin-opener = "2"
# Where the refresh token lives between runs.
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notes-sync = { path = "notes-sync" }
# The HTTPS transport, optional so the type-check below can leave it out.
notex-http = { path = "notex-http", optional = true }
# 32 bytes for a PKCE verifier and an OAuth state. Already in the tree (uuid
# pulls it), so this is a name for something that is compiled either way.
getrandom = "0.3"

# The desktop's background life: one instance (a second launch brings the first forward, with the file it was
# asked to open), opening at login, and the tray icon it lives in meanwhile (`tray-icon` above).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Held to the last releases built for Tauri 2.11: later ones need Tauri 2.12, and the Tauri CLI refuses to build
# when the `tauri` crate and `@tauri-apps/api` are on different minor versions — move them all together.
tauri-plugin-single-instance = "~2.4.5"
tauri-plugin-autostart = "~2.5.1"

# Windows' own handwriting recogniser (WinRT), for searching handwriting. The
# versions are the ones Tauri already builds, so nothing is compiled twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Foundation_Collections", "UI_Input_Inking", "Win32_System_Com"] }
windows-collections = "0.2"
windows-numerics = "0.2"

[features]
default = ["cloud-sync"]
# Compiles the real HTTPS transport in. Everything ships with it; the one
# configuration that does not is `npm run check:rust`, which type-checks this
# crate for Windows *from Linux* and so has no MSVC toolchain to build rustls's
# assembly with. Without the feature the cloud code paths still compile and
# still run — they fail with a sentence — so turning it off checks the shell
# rather than hiding it. `notex-http` itself is compiled and tested natively.
cloud-sync = ["dep:notex-http"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
