[package]
name = "notes-sync"
version = "0.1.0"
description = "Document library indexing and cross-device sync for KK-Notes"
edition = "2021"
rust-version = "1.77"

# Deliberately free of any Tauri dependency: the shell cannot be compiled or
# tested without a platform webview, and none of the logic here needs one. It
# means `cargo test -p notes-sync` runs anywhere, including CI containers.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Windows' Data Protection API, which seals the Drive refresh token for the signed-in user (`secret.rs`).
# The version is the one the shell (and Tauri) already build, so nothing is compiled twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
